services:
  api:
    build: .
    container_name: ai_employee_os_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/ai_employee_os
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    build: .
    container_name: ai_employee_os_worker
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/ai_employee_os
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ai_employee_os_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_employee_os
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_employee_os_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
